# M0.3 — every world change runs the complete local trust chain.
name: world-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the FULL v19 trust chain (2,324 tasks) instead of the rotating sample"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"   # weekly full v19 chain, Monday 06:17 UTC

permissions:
  contents: read

concurrency:
  group: world-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # v16 = frozen migration-regression world (291 tasks, cheap, runs full every
  # time); v19 = canonical (2,324 tasks) — rotating 300-task sample per PR,
  # full chain on the weekly schedule or workflow_dispatch(full).
  WORLD: world/blobfish/world-v16.json
  WORLD_V19: world/blobfish/world-v19.json
  BASE: http://127.0.0.1:8974
  PYTHONDONTWRITEBYTECODE: "1"
  FULL_CHAIN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) && '1' || '' }}

jobs:
  deterministic-trust-chain:
    name: oracle, discrimination, fixtures, badbank
    runs-on: ubuntu-latest
    # 20 min fits the PR path (v16 full + v19 sampled); the weekly FULL v19
    # chain (2,324-task oracle + 4-mode discrimination + 11,620 replays) needs
    # the headroom.
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned conformance validator
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r tools/conformance/requirements.txt

      - name: Validate scripts
        run: |
          python3 -m py_compile \
            world/local/server.py \
            world/local/evidence.py \
            world/local/product_workflows.py \
            world/local/paging.py \
            world/local/query_dsl.py \
            world/local/discriminate.py \
            world/migrate/gen1_to_v16.py \
            world/migrate/verifier.py \
            world/ingest/lab_ingest.py \
            world/manifest/normalization.py \
            world/manifest/render.py \
            world/manifest/roundtrip.py \
            world/manifest/compile_assertions.py \
            world/port/lab_determinize.py \
            world/corpus/build_ch_fts.py \
            world/v17/build.py \
            world/v17/ground_existing.py \
            world/v17/practice.py \
            world/v17/verifiers.py \
            world/v18/build.py \
            world/v18/verifiers.py \
            world/v19/build.py \
            world/v19/verifiers.py \
            harbor/generate.py \
            world/local/precorrection.py \
            world/ecosystem/compile_skills.py \
            world/ecosystem/diff_mcp_schemas.py \
            mcp/byo/courtlistener_facade.py \
            mcp/byo/legal_mcp_env.py \
            tools/check_atomic_seed.py \
            tools/check_lab_ingest.py \
            tools/check_harbor_file_lane.py \
            tools/check_harbor_export.py \
            tools/check_harbor_dataset.py \
            tools/check_ghcr_public.py \
            tools/run_harbor_production.py \
            tools/build_harvey_parity_audit.py \
            tools/hydrate_v21_evidence.py \
            tools/check_lab_port.py \
            tools/check_lab_extractor_parity.py \
            tools/check_external_evidence.py \
            tools/check_ch_fts.py \
            tools/check_retrieval_grading.py \
            tools/check_practice_import.py \
            tools/check_existing_grounding.py \
            tools/check_v17_import.py \
            tools/promote_lab_determinization.py \
            tools/report_lab_determinization.py \
            tools/sample_lab_determinization.py \
            tools/check_v18_workflows.py \
            tools/check_v19_multistep.py \
            tools/replay_v19_capstones.py \
            tools/check_m3_contracts.py \
            tools/check_pagination.py \
            tools/check_query_dsl.py \
            tools/check_auth_errors.py \
            tools/check_product_surface.py \
            tools/conformance/run.py \
            tools/conformance/check_fixtures.py \
            tools/conformance/sync_specs.py \
            tools/check_discrimination.py \
            tools/check_harbor_result.py \
            tools/check_harbor_multistep.py \
            tools/check_sweep_health.py \
            tools/check_measurement_protocol_proof.py \
            tools/build_calibration_checkpoint.py \
            tools/build_program_exit_audit.py \
            tools/check_program_exit_audit.py \
            tools/triage_world.py \
            tools/check_triage_world.py \
            tools/audit_triage_suspects.py \
            tools/check_triage_suspect_audit.py \
            tools/check_leaderboard_v2.py \
            tools/check_harbor_lane_import.py \
            tools/check_skill_task_compiler.py \
            tools/check_byo_mcp.py \
            tools/check_mcp_schema_diff.py \
            tools/build_superset_matrix.py \
            tools/check_superset_matrix.py
          node --check world/expansion/discrimination-report.mjs
          node --check sim/compare-v16-boundary.mjs
          node --check sim/run-leaderboard.mjs
          node --check sim/run-simulation.mjs
          node --check sim/build-leaderboard-v2.mjs
          node --check sim/import-harbor-lanes.mjs
          node --check sim/lib/episode-record.mjs
          node --check sim/lib/context-policy.mjs
          node --check sim/lib/cost-accounting.mjs
          node --check sim/lib/infrastructure-failure.mjs
          node --check sim/lib/storage-headroom.mjs
          node --check tools/check_infrastructure_failure.mjs
          node --check sim/lib/measurement-protocol.mjs
          node --check sim/lib/tool-scope.mjs
          node --check tools/compress_episode_records.mjs
          node --check sim/lib/sweep-health.mjs
          node --check sim/tests/sweep-health.test.mjs
          node --check sim/tests/storage-headroom.test.mjs
          node --check docs/leaderboard/build-v2-page.mjs
          python3 world/migrate/gen1_to_v16.py --check
          python3 tools/check_product_surface.py
          node sim/compare-v16-boundary.mjs
          python3 tools/check_atomic_seed.py
          python3 tools/check_lab_ingest.py
          python3 tools/check_harbor_file_lane.py
          python3 -m unittest \
            tools.tests.test_assertion_guards \
            tools.tests.test_repository_hydration \
            tools.tests.test_harbor_dataset_integrity \
            tools.tests.test_harbor_generation \
            tools.tests.test_ghcr_public \
            tools.tests.test_run_harbor_production -v
          python3 tools/check_lab_port.py
          python3 tools/check_lab_extractor_parity.py --check
          python3 tools/check_external_evidence.py
          python3 tools/check_ch_fts.py
          python3 world/corpus/build_ch_fts.py --check
          python3 tools/check_retrieval_grading.py
          python3 tools/check_practice_import.py
          python3 tools/check_existing_grounding.py
          python3 tools/check_v17_import.py
          python3 tools/report_lab_determinization.py --check
          python3 tools/sample_lab_determinization.py --check
          node world/expansion/parity-audit.mjs
          git diff --exit-code -- docs/PARITY.md
          python3 tools/check_m3_contracts.py
          python3 world/v18/build.py
          git diff --exit-code -- world/blobfish/world-v18.json world/v18/build-report.json
          python3 tools/check_v18_workflows.py
          python3 world/v19/build.py
          git diff --exit-code -- world/blobfish/world-v19.json world/v19/build-report.json
          python3 tools/check_v19_multistep.py
          python3 tools/check_sweep_health.py --proof data/leaderboard/canary-proof-v19.json
          git diff --exit-code -- data/leaderboard/canary-proof-v19.json
          python3 tools/check_triage_world.py
          node tools/check_episode_compression.mjs
          node tools/check_context_policy.mjs
          node tools/check_cost_accounting.mjs
          node tools/check_infrastructure_failure.mjs
          node sim/tests/storage-headroom.test.mjs
          node tools/check_simulation_protocol.mjs
          python3 tools/check_measurement_protocol_proof.py
          python3 tools/build_calibration_checkpoint.py
          python3 tools/triage_world.py --engine deepseek-chat --namespace v19-triage
          git diff --exit-code -- data/triage/world-v19.json docs/TRIAGE-v19.md
          python3 tools/audit_triage_suspects.py --check --require-complete
          python3 tools/check_triage_suspect_audit.py
          python3 tools/check_leaderboard_v2.py
          python3 tools/check_harbor_lane_import.py
          node sim/build-leaderboard-v2.mjs --engine deepseek-chat --namespace v19-triage
          node docs/leaderboard/build-v2-page.mjs
          git diff --exit-code -- data/leaderboard/results/deepseek-chat@v19-triage.v2.json docs/leaderboard/index.html
          python3 world/ecosystem/compile_skills.py --check
          python3 tools/check_skill_task_compiler.py
          python3 world/ecosystem/diff_mcp_schemas.py --check
          python3 tools/check_mcp_schema_diff.py
          python3 tools/check_byo_mcp.py --check-proof
          python3 tools/check_pagination.py
          python3 tools/check_query_dsl.py
          python3 -m unittest discover -s world/manifest/tests -v
          python3 -m unittest discover -s world/port/tests -v
          python3 -m unittest discover -s world/local/tests -v
          python3 tools/conformance/sync_specs.py --check
          python3 tools/conformance/check_fixtures.py
          python3 tools/conformance/run.py --check
          python3 tools/build_program_exit_audit.py --check
          python3 tools/check_program_exit_audit.py
          python3 tools/build_superset_matrix.py --check
          python3 tools/check_superset_matrix.py

      - name: Run deterministic trust chain
        run: |
          set -euo pipefail
          world_log="$RUNNER_TEMP/world.log"
          python3 world/local/server.py --port 8974 --world "$WORLD" \
            --v2-contracts mcp/v3/contracts >"$world_log" 2>&1 &
          world_pid=$!
          cleanup() {
            kill "$world_pid" 2>/dev/null || true
            wait "$world_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent "$BASE/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            sed -n '1,200p' "$world_log"
            exit 1
          fi

          python3 tools/conformance/live.py --base "$BASE" --check
          python3 tools/check_auth_errors.py --base "$BASE" --world "$WORLD"
          python3 world/local/oracle.py --base "$BASE" --world "$WORLD" \
            --out data/oracle-v16.json
          python3 world/local/discriminate.py --base "$BASE" --world "$WORLD" \
            --out data/discrimination-v16.json --report-only
          node world/expansion/discrimination-report.mjs \
            --sweep data/discrimination-v16.json \
            --world "$WORLD" \
            --docs-out docs/DISCRIMINATION-v16.md \
            --data-out data/discrimination-v16-classified.json
          BLOBFISH_LOCAL_BASE="$BASE" node mcp/test-multi-server.mjs

          cleanup
          trap - EXIT
          python3 tools/check_gates.py --world "$WORLD" --port 8975

      - name: Canonical v19 chain (rotating sample per PR; full on schedule/dispatch)
        run: |
          set -euo pipefail
          world_log="$RUNNER_TEMP/world-v19.log"
          python3 world/local/server.py --port 8974 --world "$WORLD_V19" \
            --v2-contracts mcp/v3/contracts >"$world_log" 2>&1 &
          world_pid=$!
          cleanup() {
            kill "$world_pid" 2>/dev/null || true
            wait "$world_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..240}; do
            if curl --fail --silent "$BASE/health" >/dev/null; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            sed -n '1,200p' "$world_log"; exit 1
          fi

          # CI covers the CORPUS-FREE subset (231 tasks): the LAB imports and
          # grounded-LAB drafting read the gitignored 9.2 GB evidence store at
          # request time and are provably un-runnable on hosted runners
          # (measured: exactly methods harvey_lab_* + graph_walk_grounded_lab
          # fail without it, everything else passes). Evidence-backed tasks
          # are covered by the LOCAL release gate: full oracle, discrimination
          # classifier, and the 11,620-episode fixture replay run on a corpus
          # machine, with artifacts committed and freshness-checked above.
          if [ -n "$FULL_CHAIN" ]; then
            SAMPLE="$(python3 tools/ci_sample.py --world "$WORLD_V19" --n 9999 --corpus-free)"
            echo "FULL corpus-free v19 chain (231 tasks)"
            python3 world/local/oracle.py --base "$BASE" --world "$WORLD_V19" \
              --tasks "$SAMPLE" --out "$RUNNER_TEMP/oracle-v19-full.json"
            python3 world/local/discriminate.py --base "$BASE" --world "$WORLD_V19" \
              --tasks "$SAMPLE" \
              --out "$RUNNER_TEMP/discrimination-v19-corpusfree.json" --report-only
            python3 tools/check_fixtures.py --base "$BASE" --tasks "$SAMPLE"
          else
            SAMPLE="$(python3 tools/ci_sample.py --world "$WORLD_V19" --n 150 --corpus-free)"
            echo "sampled corpus-free v19 chain (150 rotating tasks)"
            python3 world/local/oracle.py --base "$BASE" --world "$WORLD_V19" \
              --tasks "$SAMPLE" --out "$RUNNER_TEMP/oracle-v19-sample.json"
            python3 tools/check_fixtures.py --base "$BASE" --tasks "$SAMPLE"
          fi

      - name: Require committed audit artifacts to be current
        run: |
          git diff --exit-code -- \
            data/oracle-v16.json \
            data/discrimination-v16.json \
            data/discrimination-v16-classified.json \
            docs/DISCRIMINATION-v16.md \
            data/migration/v16-boundary-shift.json \
            docs/V16-BOUNDARY-SHIFT.md

  harbor-smoke:
    name: Harbor oracle and no-op smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"

      - name: Materialize locked Harbor runner
        run: uv sync --project harbor/runner --locked --no-dev

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate smoke tasks
        run: |
          python3 harbor/generate.py \
            --world "$WORLD" \
            --out dist/harbor-ci \
            --tasks task_003,task_v3_001,task_194 \
            --image-tag legal-agent-sim-world:ci

      - name: Build cached world image
        run: |
          solve_token_hash="$(python3 -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("dist/harbor-ci/world-image/solve-token.txt").read_text().strip().encode()).hexdigest())')"
          docker buildx build --load \
            --tag legal-agent-sim-world:ci \
            --build-arg "ORACLE_PROOF_SHA256=$solve_token_hash" \
            --cache-from type=gha,scope=world-v16 \
            --cache-to type=gha,mode=max,scope=world-v16 \
            dist/harbor-ci/world-image

      - name: Oracle must pass all three tasks
        run: |
          uv run --project harbor/runner --locked harbor run \
            --path dist/harbor-ci/tasks \
            --agent oracle \
            --jobs-dir jobs/world-ci \
            --job-name m0-harbor-oracle \
            --n-concurrent 3 --quiet --yes
          python3 tools/check_harbor_result.py \
            --job jobs/world-ci/m0-harbor-oracle \
            --tasks task_003 task_v3_001 task_194 \
            --reward 1 --passed 1

      - name: No-op must fail all three tasks
        run: |
          uv run --project harbor/runner --locked harbor run \
            --path dist/harbor-ci/tasks \
            --agent nop \
            --jobs-dir jobs/world-ci \
            --job-name m0-harbor-nop \
            --n-concurrent 3 --quiet --yes
          python3 tools/check_harbor_result.py \
            --job jobs/world-ci/m0-harbor-nop \
            --tasks task_003 task_v3_001 task_194 \
            --reward 0 --passed 0

  v21-scale:
    name: v21 10x rebuild and exhaustive verifier gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install pinned v21 document dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r tools/v21-requirements.txt

      - name: Validate v20/v21 sources
        run: |
          python3 -m py_compile \
            world/v20/build.py \
            world/v20/build_retail.py \
            world/v21/catalog.py \
            world/v21/build_contracts.py \
            world/v21/build.py \
            world/v21/verifiers.py \
            world/local/v21_verifier_runtime.py \
            research/lab_mutate.py \
            tools/build_v21_seed_documents.py \
            tools/check_harvey_mutation_inventory.py \
            tools/check_v20_retail.py \
            tools/check_v21_scale.py

      - name: Rebuild v20 and v21 from tracked inputs
        run: |
          python3 world/v20/build_retail.py
          python3 world/v20/build.py \
            --base world/blobfish/world-v20.json \
            --out world/blobfish/world-v20-draft.json
          python3 world/v21/build_contracts.py
          python3 tools/build_v21_seed_documents.py
          python3 tools/build_v21_seed_documents.py --check
          python3 world/v21/build.py

      - name: Run exhaustive scale, state, trace, and adversarial gates
        run: |
          python3 tools/check_v20_retail.py
          python3 tools/check_v21_scale.py
          python3 -m unittest tools.tests.test_harvey_mutations -v
          python3 -m unittest tools.tests.test_v21_document_rendering -v
