name: Publish v21 runtime images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GHCR image tag
        required: true
        default: v21
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: v21-production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild, verify, and publish v21
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORLD_IMAGE: ghcr.io/blobfishai/legal-agent-sim-world
      LAB_IMAGE: ghcr.io/blobfishai/legal-agent-sim-agent-lab
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Validate image tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          release_suffix="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WORLD_CANDIDATE=$WORLD_IMAGE:$TAG-$release_suffix" >> "$GITHUB_ENV"
          echo "LAB_CANDIDATE=$LAB_IMAGE:$TAG-$release_suffix" >> "$GITHUB_ENV"

      - name: Install pinned document dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r tools/v21-requirements.txt

      - name: Install pinned Harbor runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"

      - name: Materialize locked Harbor runner
        run: uv sync --project harbor/runner --locked --no-dev

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Rebuild and exhaustively verify v21
        run: |
          set -euo pipefail
          npm run v21:build
          npm run v21:check
          python3 -m unittest tools.tests.test_v21_document_rendering -v
          jq -e '.world_sha256 == "76364790d9a548f01af25337a170c49269cbfeaf3f3b667db9460c29bdb2f5ab"' \
            world/v21/build-report.json

      - name: Hydrate checksum-pinned production evidence
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          python3 tools/hydrate_v21_evidence.py
          python3 tools/hydrate_v21_evidence.py --check

      - name: Assemble the production image context
        env:
          HARBOR_SOLVE_TOKEN: ${{ secrets.V21_HARBOR_SOLVE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$HARBOR_SOLVE_TOKEN" =~ ^[0-9a-f]{32,128}$ ]]
          python3 harbor/generate.py \
            --world world/blobfish/world-v21.json \
            --contracts mcp/v5/contracts \
            --out dist/harbor-v21-release \
            --tasks labp_b50165c2a9cd39db,task_v20_cp_001,task_v20_retail_national_closeout,task_v21_lt_matters_00001,task_v21_lt_matters_00005 \
            --image-tag "$WORLD_CANDIDATE" \
            --lab-agent-image "$LAB_CANDIDATE"
          python3 tools/check_harbor_export.py \
            --root dist/harbor-v21-release \
            --world world/blobfish/world-v21.json \
            --expected-tasks 5 \
            --world-image "$WORLD_CANDIDATE" \
            --lab-image "$LAB_CANDIDATE" \
            --verify-evidence

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable release candidates
        run: |
          set -euo pipefail
          token_hash=$(tr -d '\n' < dist/harbor-v21-release/world-image/solve-token.txt | sha256sum | cut -d' ' -f1)
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$LAB_CANDIDATE" \
            dist/harbor-v21-release/lab-agent-image
          docker run --rm --network none --volume "$GITHUB_WORKSPACE:/repo:ro" "$LAB_CANDIDATE" \
            python /repo/tools/check_v21_document_rendering.py \
              --root /repo/research/v21-seeded-documents \
              --no-contact-sheets --workers 4
          docker build \
            --build-arg "ORACLE_PROOF_SHA256=$token_hash" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$WORLD_CANDIDATE" \
            dist/harbor-v21-release/world-image
          fixture_root="$GITHUB_WORKSPACE/research/v21-seeded-documents/packs/bankruptcy/variant-01/documents"
          docker run --rm --network none --volume "$fixture_root:/fixtures:ro" "$LAB_CANDIDATE" \
            bash -euc '
              python -c "import defusedxml, diff_match_patch, docxtpl, lxml, markitdown, openpyxl, pandas, pdf2image, pdfplumber, PIL, pypdf, docx, pptx"
              node -e "require(\"docx\"); require(\"pptxgenjs\")"
              libreoffice --version
              pandoc --version | head -n 1
              parse-doc docx /fixtures/matter-brief.docx > /tmp/docx.txt
              parse-doc xlsx /fixtures/evidence-register.xlsx > /tmp/xlsx.txt
              parse-doc pdf /fixtures/source-extract.pdf > /tmp/pdf.txt
              test -s /tmp/docx.txt
              test -s /tmp/xlsx.txt
              test -s /tmp/pdf.txt
            '
          docker push "$LAB_CANDIDATE"
          docker push "$WORLD_CANDIDATE"
          docker image rm "$LAB_CANDIDATE" "$WORLD_CANDIDATE"
          docker pull "$LAB_CANDIDATE"
          docker pull "$WORLD_CANDIDATE"

      - name: Validate pushed candidates in Harbor
        run: |
          set -euo pipefail
          uv run --project harbor/runner --locked harbor run \
            --path dist/harbor-v21-release/tasks \
            --agent oracle \
            --jobs-dir jobs/v21-release \
            --job-name production-oracle \
            --n-concurrent 1 --quiet --yes
          python3 tools/check_harbor_result.py \
            --job jobs/v21-release/production-oracle \
            --tasks labp_b50165c2a9cd39db task_v20_cp_001 task_v20_retail_national_closeout task_v21_lt_matters_00001 task_v21_lt_matters_00005 \
            --reward 1 --passed 1
          uv run --project harbor/runner --locked harbor run \
            --path dist/harbor-v21-release/tasks \
            --agent nop \
            --jobs-dir jobs/v21-release \
            --job-name production-nop \
            --n-concurrent 1 --quiet --yes
          python3 tools/check_harbor_result.py \
            --job jobs/v21-release/production-nop \
            --tasks labp_b50165c2a9cd39db task_v20_cp_001 task_v20_retail_national_closeout task_v21_lt_matters_00001 task_v21_lt_matters_00005 \
            --reward 0 --passed 0

      - name: Promote validated candidates to production
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$LAB_IMAGE:$TAG" "$LAB_CANDIDATE"
          docker buildx imagetools create --prefer-index=false --tag "$WORLD_IMAGE:$TAG" "$WORLD_CANDIDATE"
          lab_candidate_digest="sha256:$(docker buildx imagetools inspect "$LAB_CANDIDATE" --raw | sha256sum | cut -d' ' -f1)"
          lab_production_digest="sha256:$(docker buildx imagetools inspect "$LAB_IMAGE:$TAG" --raw | sha256sum | cut -d' ' -f1)"
          world_candidate_digest="sha256:$(docker buildx imagetools inspect "$WORLD_CANDIDATE" --raw | sha256sum | cut -d' ' -f1)"
          world_production_digest="sha256:$(docker buildx imagetools inspect "$WORLD_IMAGE:$TAG" --raw | sha256sum | cut -d' ' -f1)"
          [[ "$lab_candidate_digest" == "$lab_production_digest" ]]
          [[ "$world_candidate_digest" == "$world_production_digest" ]]
          echo "LAB_DIGEST=$lab_production_digest" >> "$GITHUB_ENV"
          echo "WORLD_DIGEST=$world_production_digest" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "$LAB_IMAGE:$TAG"
          docker buildx imagetools inspect "$WORLD_IMAGE:$TAG"

      - name: Record release summary
        run: |
          {
            echo '### v21 production images'
            echo
            echo "- World image: \`$WORLD_IMAGE:$TAG\`"
            echo "- File-lane agent image: \`$LAB_IMAGE:$TAG\`"
            echo "- World digest: \`$WORLD_DIGEST\`"
            echo "- File-lane digest: \`$LAB_DIGEST\`"
            echo "- Validated candidate: \`$WORLD_CANDIDATE\`"
            echo "- Harbor oracle/no-op production gate: 5/5 pass and 5/5 reject"
            echo "- Commit: \`${{ github.sha }}\`"
            echo '- World SHA-256: `76364790d9a548f01af25337a170c49269cbfeaf3f3b667db9460c29bdb2f5ab`'
            echo '- Exhaustive v21 checker: passed before publication'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require anonymous production pulls
        run: >-
          python3 tools/check_ghcr_public.py
          "$LAB_IMAGE@$LAB_DIGEST"
          "$WORLD_IMAGE@$WORLD_DIGEST"
